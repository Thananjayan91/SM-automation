<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Social Publisher — Multi-tenant social media content platform">
    <title>{% block title %}{% if title %}{{ title }} — {% endif %}AI Social Publisher{% endblock %}</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom styles -->
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block body %}
    {% endblock %}

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
    <!-- Custom App JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <!-- HTMX CSRF token injection -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.body.addEventListener('htmx:configRequest', function(evt) {
                const meta = document.querySelector('meta[name="csrf-token"]');
                if (meta) {
                    evt.detail.headers['X-CSRFToken'] = meta.content;
                }
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
