<!-- Top navigation bar -->
<header class="topbar bg-white border-bottom px-4 py-2 d-flex align-items-center gap-3">
    <!-- Mobile menu toggle -->
    <button class="btn btn-light btn-sm d-lg-none" onclick="toggleSidebar()" aria-label="Toggle menu">
        <i class="bi bi-list fs-5"></i>
    </button>

    <!-- Page title / breadcrumb -->
    <div class="flex-grow-1">
        <h1 class="h5 mb-0 fw-semibold">{% block page_title %}{{ title }}{% endblock %}</h1>
    </div>

    <!-- Right actions -->
    <div class="d-flex align-items-center gap-2">
        {% if tenant %}
        <a href="{{ url_for('web.new_post') }}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i>
            <span class="d-none d-md-inline">Create post</span>
        </a>
        {% endif %}

        <!-- Notifications -->
        <button class="btn btn-light btn-sm position-relative" aria-label="Notifications">
            <i class="bi bi-bell fs-5"></i>
        </button>
    </div>
</header>
