{% extends "layouts/app.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-transparent border-0">
                <h5 class="fw-semibold mb-0">Security settings</h5>
            </div>
            <div class="card-body">
                <div class="mb-4">
                    <h6 class="fw-semibold">Change password</h6>
                    <a href="{{ url_for('auth.forgot_password') }}" class="btn btn-outline-primary btn-sm">
                        Request password reset
                    </a>
                </div>
                <div>
                    <h6 class="fw-semibold">Sign out everywhere</h6>
                    <p class="text-muted small">Sign out of all active sessions.</p>
                    <form method="POST" action="{{ url_for('auth.logout') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-outline-danger btn-sm">Sign out</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
